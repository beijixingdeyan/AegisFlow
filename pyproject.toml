[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisflow"
version = "1.0.0"
description = "AegisFlow — AI-native Zero-Trust Behavioral Detection & Autonomous Response platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "AegisFlow Project" }]
keywords = ["security", "zero-trust", "anomaly-detection", "siem", "ml", "mlsecops", "behavioral-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
# Optional extras — all demo/tests work without these (stdlib-only core).
ml = ["numpy", "scikit-learn", "shap"]
web = ["fastapi", "uvicorn", "pydantic"]
test = ["pytest"]

[project.scripts]
aegisflow = "aegisflow.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
